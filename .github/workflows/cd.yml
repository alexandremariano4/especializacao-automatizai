# Continuous Deployment: executa os testes unitarios, faz o deploy preview na
# Vercel e roda os testes E2E (Playwright) contra essa preview a cada push em main.

name: Continuous Deployment

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: '24'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    # O app Vite vive em app/velo, entao todos os passos rodam a partir dessa pasta
    defaults:
      run:
        working-directory: app/velo

    steps:
      # Faz o checkout do repositorio no runner
      - name: Checkout repository
        uses: actions/checkout@v7

      # Configura o Node.js conforme a variavel NODE_VERSION
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Instala as dependencias. Usa npm install (e nao npm ci) porque o Vitest 4
      # / rolldown trazem optional native deps platform-specific (@emnapi, etc)
      # que ficam ausentes do lock quando ele e gerado em Windows.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Executa a suite de testes unitarios (Vitest)
      - name: Run unit tests
        run: npm run test:unit

  build-and-deploy:
    name: Build and Deploy Vercel Preview
    needs: [unit-tests]
    runs-on: ubuntu-latest

    # Os IDs do projeto/org sao lidos pela Vercel CLI a partir destas env vars.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    # A URL do preview e exposta para o job seguinte de E2E consumir.
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Instala a Vercel CLI versionada como devDependency na raiz.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Sincroniza as configuracoes e variaveis de ambiente do projeto na Vercel.
      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      # Roda o build atraves da Vercel CLI (usa o buildCommand do vercel.json).
      - name: Build Vercel
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}

      # Publica o artefato pre-buildado como preview e captura a URL do deploy.
      - name: Deploy Preview
        id: deploy
        run: |
          url=$(npx vercel deploy --prebuilt --target=preview --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview publicada em: $url"

  e2e-tests:
    name: E2E Tests (Playwright)
    needs: [build-and-deploy]
    runs-on: ubuntu-latest

    # Usa a imagem oficial do Playwright (browsers e libs ja instalados),
    # evitando o gargalo de "playwright install --with-deps" no runner.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
      options: --user 1001

    # A BASE_URL aponta para a preview recem-publicada; o playwright.config.ts
    # le essa env var via process.env.BASE_URL. A DATABASE_URL e usada pela
    # camada Kysely para semear/limpar pedidos durante os testes.
    env:
      BASE_URL: ${{ needs.build-and-deploy.outputs.preview_url }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Instala dependencias da raiz (inclui @playwright/test e a camada Kysely).
      # O Node ja vem na imagem do Playwright (24.x).
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Executa a suite Playwright contra a preview URL exposta pelo job anterior.
      - name: Run Playwright tests
        run: npx playwright test --project=chromium

      # Sempre publica o relatorio HTML e os artefatos brutos (traces, screenshots,
      # videos) gerados pelo Playwright. O trace.zip pode ser aberto em
      # https://trace.playwright.dev para inspecionar o ambiente real do teste.
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  promote:
    name: Promote to Production
    needs: [e2e-tests, build-and-deploy]
    runs-on: ubuntu-latest

    # Os IDs do projeto/org sao lidos pela Vercel CLI a partir destas env vars.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Instala a Vercel CLI versionada como devDependency na raiz.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Promove a preview que passou nos testes E2E para o ambiente de producao.
      # vercel promote reusa o build, sem rebuildar. O --scope e necessario porque
      # a CLI 48 ignora VERCEL_ORG_ID no comando promote.
      - name: Promote preview to production
        run: |
          npx vercel promote ${{ needs.build-and-deploy.outputs.preview_url }} \
            --scope=automatiz-ai-alexandre \
            --token=${{ secrets.VERCEL_TOKEN }}
          echo "Preview promovida para producao: ${{ needs.build-and-deploy.outputs.preview_url }}"
